server {
 listen 80;
 server_name _;
 server_tokens off;
 client_max_body_size 1m;
 # Bind only to loopback; terminate TLS in an upstream ingress.
 location ~ ^/api/patients/[0-9a-fA-F-]+/attachments/?$ {
  client_max_body_size 14m;
  proxy_pass http://api:4000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location ~ ^/api/patients/[0-9a-fA-F-]+/consents/[0-9a-fA-F-]+/events/?$ {
  client_max_body_size 7m;
  proxy_pass http://api:4000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /api/ {
  proxy_pass http://api:4000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /health/ { proxy_pass http://api:4000; }
 location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
}
